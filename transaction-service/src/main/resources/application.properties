spring.application.name=transaction-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:transactiondb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Business rule (moves to config-service in Step 5)
bank.transaction.max-amount=1000

# Feign client to account-service (this url line is removed when Eureka is added)
bank.clients.account-service.url=http://localhost:8081
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000

# Resilience4J around Feign calls, one breaker per downstream service
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true